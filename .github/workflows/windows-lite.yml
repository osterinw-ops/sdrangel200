name: SDRangel Lite (USRP B2xx + ATV, no camera) Windows build

on:
  push:
    branches:
      - lite
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-lite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows-x64-lite
    runs-on: windows-latest
    env:
      QT_VERSION: "6.9.3"
      BOOST_URL: https://archives.boost.io/release/1.73.0/source/boost_1_73_0.tar.bz2
      ETTUS_CACHE: https://files.ettus.com/binaries/cache
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set PATH
        shell: bash
        run: echo "C:\Program Files (x86)\NSIS" >> "$GITHUB_PATH"
      - name: Install basic dependencies
        run: |
          choco install ninja cmake nsis.install patch
          makensis /VERSION
      - name: Install MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Boost
        shell: bash
        run: |
          mkdir -p downloads/boost /c/Libraries
          curl --fail --location --output downloads/boost/boost.tar.bz2 "$BOOST_URL"
          7z -odownloads/boost x downloads/boost/boost.tar.bz2 -y -bd > /dev/null
          7z -odownloads/boost x downloads/boost/boost.tar -y -bd > /dev/null
          cp -r downloads/boost/boost_1_73_0 /c/Libraries/
          rm -rf downloads/boost
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          dir: "C:/"
          arch: win64_msvc2022_64
          setup-python: 'false'
          modules: 'qtcharts qtscxml qt5compat qtlocation qtmultimedia qtpositioning qtserialport qtspeech qtwebsockets qtwebengine qtshadertools qtwebchannel'
      - name: Download USRP B2xx images and WinUSB driver (UHD 4.11.0)
        shell: bash
        run: |
          set -euo pipefail
          B=usrp_bundle; mkdir -p $B/images $B/driver dl
          fetch() { # path sha256
            f="dl/$(basename "$1")"
            curl --fail --location --retry 3 --output "$f" "$ETTUS_CACHE/$1"
            echo "$2  $f" | sha256sum -c -
          }
          fetch b2xx/uhd-c37b318/b2xx_b200_fpga_default-gc37b318.zip 35542b8a2b6a6dfd3aa155c35364af85c2599cfb692b0cf94013c5342c945448
          fetch b2xx/uhd-c37b318/b2xx_b210_fpga_default-gc37b318.zip ab1cdbe93090fdcf590a79cbe938749f8a5fbd7b45422b7833b8c841aa2106b4
          fetch b2xx/uhd-c37b318/b2xx_b200mini_fpga_default-gc37b318.zip c1865c6e574cf453a688c6bfb8fe5e3646cd53458ae403cf11d3eeb7dc6a9918
          fetch b2xx/uhd-c37b318/b2xx_b205mini_fpga_default-gc37b318.zip dce96120e3512d6e21bb061811c4021cbc90ac4d787248ad821337b7389ff3c4
          fetch b2xx/uhd-7f7d016/b2xx_common_fw_default-g7f7d016.zip 22ac0e54cc90d53d8494d481439447a0c89b9bbaced6fabe24df260eda3ce3a3
          fetch usb/uhd-ccf87eb/usb_common_windrv_default-gccf87eb.zip 0d7e0b89619bb96bb620724fd417564560c50c2c3fcc886ece1f04e175f89c85
          for z in dl/b2xx_*.zip; do 7z x "$z" -odl/img -y -bd > /dev/null; done
          find dl/img -type f \( -name '*.bin' -o -name '*.hex' -o -name '*.rpt' \) -exec cp {} $B/images/ \;
          7z x dl/usb_common_windrv_default-gccf87eb.zip -odl/drv -y -bd > /dev/null
          echo "Driver package content:"; find dl/drv -type f
          cp -r dl/drv/. $B/driver/
          ls -l $B/images $B/driver
          test -n "$(find $B/driver -iname '*.inf')"
          echo "USRP_BUNDLE=$(cygpath -m "$PWD/$B")" >> "$GITHUB_ENV"
      - name: Build SDRangel Lite
        shell: bash
        run: |
          set -o pipefail
          mkdir build && cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release -DENABLE_QT6=ON -DARCH_OPT=SSE4_2 -DBUILD_SERVER=OFF \
            "-DSDRANGEL_USRP_BUNDLE_DIR=$USRP_BUNDLE" \
            "-DCMAKE_PREFIX_PATH=C:/Qt/$QT_VERSION/msvc2022_64;C:/Libraries/boost_1_73_0" \
            "-DENABLE_CHANNELRX=OFF" \
            "-DENABLE_CHANNELMIMO=OFF" \
            "-DENABLE_FEATURE=OFF" \
            "-DENABLE_USRP=ON" \
            "-DATVMOD_NO_CAMERA=ON" \
            "-DENABLE_AARONIARTSA=OFF" \
            "-DENABLE_AIRSPY=OFF" \
            "-DENABLE_AIRSPYHF=OFF" \
            "-DENABLE_BLADERF=OFF" \
            "-DENABLE_FUNCUBE=OFF" \
            "-DENABLE_HACKRF=OFF" \
            "-DENABLE_IIO=OFF" \
            "-DENABLE_LIMESUITE=OFF" \
            "-DENABLE_METIS=OFF" \
            "-DENABLE_MIRISDR=OFF" \
            "-DENABLE_PERSEUS=OFF" \
            "-DENABLE_RTLSDR=OFF" \
            "-DENABLE_SDRPLAY=OFF" \
            "-DENABLE_SOAPYSDR=OFF" \
            "-DENABLE_XTRX=OFF" \
            "-DENABLE_FOBOS=OFF" \
            "-DENABLE_CHANNELTX_MODM17=OFF" \
            "-DENABLE_CHANNELTX_MODNFM=OFF" \
            "-DENABLE_CHANNELTX_MODAIS=OFF" \
            "-DENABLE_CHANNELTX_LOCALSOURCE=OFF" \
            "-DENABLE_CHANNELTX_MODDATV=OFF" \
            "-DENABLE_CHANNELTX_MODAM=OFF" \
            "-DENABLE_CHANNELTX_MODFREEDV=OFF" \
            "-DENABLE_CHANNELTX_MODPACKET=OFF" \
            "-DENABLE_CHANNELTX_MODSSB=OFF" \
            "-DENABLE_CHANNELTX_UDPSOURCE=OFF" \
            "-DENABLE_CHANNELTX_MODCHIRPCHAT=OFF" \
            "-DENABLE_CHANNELTX_MODMESHTASTIC=OFF" \
            "-DENABLE_CHANNELTX_MODMESHCORE=OFF" \
            "-DENABLE_CHANNELTX_MODWFM=OFF" \
            "-DENABLE_CHANNELTX_MODBFM=OFF" \
            "-DENABLE_CHANNELTX_MODATV=ON" \
            "-DENABLE_CHANNELTX_MOD802.15.4=OFF" \
            "-DENABLE_CHANNELTX_REMOTESOURCE=OFF" \
            "-DENABLE_CHANNELTX_FILESOURCE=OFF" \
            "-DENABLE_CHANNELTX_MODRTTY=OFF" \
            "-DENABLE_CHANNELTX_MODPSK31=OFF" 2>&1 | tee ../build.log
          cmake --build . --config Release --target package 2>&1 | tee -a ../build.log
      - name: List plugins in package
        shell: bash
        run: find build/_CPack_Packages -path '*plugins*' -name '*.dll' | sed 's|.*/||' | sort
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: sdrangel-lite-win64-installer
          path: build/sdrangel-*-win64.exe
      - name: Publish build log on failure (branch ci-logs)
        if: failure()
        shell: bash
        run: |
          mkdir -p /tmp/ci && cd /tmp/ci
          git init -q && git checkout -q -b ci-logs
          { echo "run: ${{ github.run_id }} sha: ${{ github.sha }}"; echo; tail -n 3000 "$GITHUB_WORKSPACE/build.log" 2>/dev/null || echo "no build.log (failed before build step)"; } > build-tail.log
          grep -n -i -E "error|fatal" "$GITHUB_WORKSPACE/build.log" 2>/dev/null | head -400 > errors.log || true
          git add . && git -c user.name=ci -c user.email=ci@localhost commit -q -m "build log for run ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs
